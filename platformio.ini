; Remote Thermal Printer Bridge V0.1
; Primary build system: PlatformIO (Arduino-ESP32 2.0.x / espressif32@6.9.0).
;
; Build targets:
;   s3_n16r8       - MAIN dev board, ESP32-S3 N16R8 (16MB flash, OPI PSRAM)
;   s3_supermini   - regression target, ESP32-S3 SuperMini (8MB, no PSRAM)
;   wroom32e_future- future dual-mode candidate. Board abstraction / build only.
;                    NO physical board and NO Classic Bluetooth implementation.
;
; Windows note: the xtensa toolchain cannot handle non-ASCII paths. Use
; tools/build.ps1, which mirrors this project into an ASCII directory.

[platformio]
default_envs = s3_n16r8
boards_dir = boards
src_dir = src

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
  -Isrc
  -Wall
  -DCORE_DEBUG_LEVEL=1

[env:s3_n16r8]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
; Real N16R8: 16MB QUAD (QIO) flash + 8MB OPI PSRAM. eFuse reports quad flash,
; so opi_opi (octal flash) aborts at cpu_start. qio_opi keeps OPI PSRAM.
; Verified on hardware 2026-11-08; see docs/V0.1_REPORT.md.
board_build.arduino.memory_type = qio_opi
board_build.arduino.partitions = default_16MB.csv
build_flags =
  ${env.build_flags}
  -DRTB_TARGET_S3_N16R8=1
  -DBOARD_HAS_PSRAM

[env:s3_supermini]
board = esp32-s3-supermini
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
board_build.arduino.partitions = default_8MB.csv
build_flags =
  ${env.build_flags}
  -DRTB_TARGET_S3_SUPERMINI=1

[env:wroom32e_future]
; ESP32-DevKitC-32E (ESP32-WROOM-32E module, 4 MB flash, no PSRAM).
; Real hardware arrived 2026-11-10. The env NAME is kept as-is on purpose:
; tools/build.ps1 and docs reference it, and renaming it changes nothing about
; the produced firmware.
; With WiFi+BLE+WebServer the firmware is ~1.6 MB, so the 4 MB default.csv
; (1.25 MB app slots) does not fit. huge_app.csv = single 3 MB app slot.
; Production partition scheme (dual OTA slots) and Flash/PSRAM part numbers are
; deliberately NOT locked until real hardware and memory tests are possible.
; Classic Bluetooth stays OFF for this target too (RTB_ENABLE_BT_CLASSIC_IMPL=0
; in src/config/RtbConfig.h): only the chip CAPABILITY is reported as true.
board = esp32dev
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.arduino.partitions = huge_app.csv
upload_speed = 460800
monitor_speed = 115200
; Never let the serial monitor (or a port open) toggle DTR/RTS: on a DevKitC
; those lines drive EN/IO0 through the auto-reset circuit, so a monitor attach
; would reset the board and destroy the boot log we are trying to capture.
monitor_dtr = 0
monitor_rts = 0
build_flags =
  ${env.build_flags}
  -DRTB_TARGET_WROOM32E=1
  ; Heap telemetry for the hardware validation of the /api/print OOM fix.
  ; Remove once the fix is confirmed on 32E.
  -DRTB_DEBUG_HEAP=1
